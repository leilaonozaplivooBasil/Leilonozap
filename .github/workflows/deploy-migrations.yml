# Deploy de migração do Supabase — Leilão NoZap
#
# O QUE ELA FAZ: quando um arquivo novo entra em supabase/migrations/ e chega
# no `main` (só depois de passar por Pull Request — main tem ruleset ativo
# desde 21/08/2026, exigindo PR pra qualquer mudança), aplica essa migração
# no banco de PRODUÇÃO automaticamente, com `supabase db push`.
#
# POR QUE ISSO NÃO EXISTIA ANTES: até 21/08/2026 esse passo era manual — colar
# o SQL no SQL Editor do Supabase depois de cada merge. Isso já causou uma
# regressão real (RPC e CHECK do plano de estoque ficaram ausentes em
# produção por ~20 minutos, sem ninguém perceber, até a conferência manual
# achar). Guardar a credencial de produção aqui só foi liberado DEPOIS de
# proteger o `main` (ver .github/workflows/ci.yml, comentário do topo) —
# sem essa proteção, qualquer push direto no main poderia alterar este
# workflow pra usar a credencial pra qualquer coisa.
#
# O QUE ELA NÃO FAZ:
#   • não roda em Pull Request — só depois de já estar no main;
#   • não toca em nada além de supabase/migrations/** (path filtro abaixo);
#   • não decide o que a migração faz — isso já foi revisado no PR.
#
# SEGREDOS NECESSÁRIOS (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  → gerado em supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   → Project Settings → Database → Database Password
#                            (a senha do banco, não o access token)
#   SUPABASE_PROJECT_REF   → gezvviyegtxytnwjkrjv (id do projeto, já no
#                            final da URL do dashboard) — pode ficar fixo
#                            abaixo em vez de secret, não é sensível sozinho.
name: Deploy migração Supabase

on:
  push:
    branches: [main]
    paths:
      # Só .sql: mexer no LEIA-ME.md da pasta não é motivo pra rodar deploy
      # contra o banco de produção.
      - 'supabase/migrations/**.sql'

permissions:
  contents: read

jobs:
  aplicar-migracao:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ⚠️ VERSÃO FIXA, NÃO `latest` (28/08/2026 — o motivo de este workflow nunca
      # ter funcionado). Com `latest`, a action consulta a API do GitHub pra
      # descobrir a última release do CLI. Essa consulta sai SEM autenticação, e o
      # runner divide o limite de 60 req/hora por IP com todo mundo — resultado:
      # "Failed to resolve latest Supabase CLI release: rate limit exceeded".
      # O job morria AQUI, antes de chegar no db push.
      #
      # As 8 execuções deste workflow desde 21/08/2026 falharam exatamente assim.
      # Nenhuma migração foi aplicada automaticamente nesse período: as que estão
      # em produção foram todas coladas no SQL Editor na mão, e as que ninguém
      # lembrou de colar não existiam no banco. Foi o que aconteceu com
      # financial_income, cost_center e recurring_group_id (PRs #132/#134) —
      # código em produção desde 27/08 gravando em tabela e colunas inexistentes,
      # receita não registrada e o cron gerarGastosFixos falhando calado às 06:00
      # todo dia, até a conferência de 28/08 achar.
      #
      # Versão fixa também deixa o deploy reproduzível: uma release nova do CLI
      # não passa a rodar contra produção sozinha, sem ninguém ter revisado.
      # Pra atualizar: `npm view supabase version` e troque o número aqui.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
        env:
          # Cinto de segurança: se um dia alguém voltar pra `latest`, a consulta vai
          # autenticada (limite sobe de 60 pra 1.000 req/hora) em vez de morrer no
          # rate limit. Com a versão fixa acima, nem chega a ser usado.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: link no projeto de produção
        run: supabase link --project-ref gezvviyegtxytnwjkrjv
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ⚠️ `--include-all` (06/09/2026): sem ele o CLI RECUSA aplicar migração
      # com data anterior à última já registrada no banco ("Found local migration
      # files to be inserted before the last migration on remote database") e sai
      # com exit 1 — foi o último obstáculo do conserto da DIR-71.
      #
      # A fila não é ordenada porque 15 dias de migração entraram na mão, fora de
      # ordem: as que faltavam de verdade são de 30/07 a 01/09, e o banco já tinha
      # registro de 05/09. Exigir ordem aqui seria exigir uma história que não
      # existe.
      #
      # E por que isso é seguro AGORA, e não seria ontem: a auditoria de 06/09
      # conferiu as 56 migrações objeto a objeto contra o banco e registrou no
      # histórico tudo que já estava aplicado. A fila pendente ficou sendo só o
      # que falta de verdade — e nenhuma delas altera dados. Sem esse acerto,
      # `--include-all` teria rodado backfill e limpeza de dados de novo.
      - name: aplicar migrações pendentes
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Rede de baixo. O `db push` acima devolve exit 0 mesmo quando PULA um arquivo
      # cujo nome não bate com o padrão do CLI ("Skipping migration ..."), então um
      # workflow verde não prova que a migração entrou. O teste de nomes roda no CI e
      # barra isso antes do merge; se ainda assim algum escapar, este passo deixa o
      # deploy VERMELHO em vez de mentir que deu certo.
      - name: conferir que nenhuma migração foi pulada
        run: node scripts/checar-nomes-migracoes.mjs
